name: ZeroCut Source Truth Smoke

on:
  workflow_dispatch:
  push:
    branches: [main, "candidate/**"]
    paths:
      - "src/**"
      - "runtime/**"
      - "rollback/**"
      - "reports/**"
      - "tests/**"
      - "ZeroCut.cmd"
      - "STATUS.md"
      - "CURRENT_MISSION.md"
      - ".github/workflows/zerocut-smoke.yml"

jobs:
  source-truth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install FFmpeg test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          ffmpeg -version
          ffprobe -version
      - name: Verify recovered baseline
        run: python tests/test_source_truth.py
      - name: Run101 media reliability integration
        if: hashFiles('src/ZeroCut_Run101_Candidate_MediaReliability.pyw') != ''
        run: python tests/test_run101_media_reliability.py
      - name: Run102 project recovery integration
        if: hashFiles('src/ZeroCut_Run102_Candidate_ProjectRecovery.pyw') != ''
        run: python tests/test_run102_project_recovery.py
      - name: Run103 concurrency safety
        if: hashFiles('src/ZeroCut_Run103_Candidate_ConcurrencySafety.pyw') != ''
        run: python tests/test_run103_concurrency_safety.py
      - name: Run106 timeline reliability
        if: hashFiles('src/ZeroCut_Run106_Candidate_TimelineReliability.pyw') != ''
        run: python tests/test_run106_timeline_reliability.py
      - name: Run107 A/V integrity
        if: hashFiles('src/ZeroCut_Run107_Candidate_AVIntegrity.pyw') != ''
        run: python tests/test_run107_av_integrity.py
      - name: Run108 highlight core
        if: hashFiles('src/ZeroCut_Run108_Candidate_HighlightCore.pyw') != ''
        run: python tests/test_run108_highlight_core.py
      - name: Run109 R6 evidence gate
        if: hashFiles('src/ZeroCut_Run109_Candidate_R6EvidenceGate.pyw') != ''
        run: python tests/test_run109_r6_evidence_gate.py
      - name: Run111 real Whisper certification
        if: hashFiles('src/ZeroCut_Run111_Candidate_WhisperCertification.pyw') != ''
        run: python tests/test_run111_whisper_certification.py
      - name: Run112 Whisper product UX
        if: hashFiles('src/ZeroCut_Run112_Candidate_WhisperUX.pyw') != ''
        run: python tests/test_run112_whisper_ux.py
      - name: Run116 transcript and auto-edit regression
        run: python tests/test_run116_transcript_regression.py
      - name: Run117 transcript edit UI
        run: python tests/test_run117_transcript_ui.py
      - name: Run118 edited timeline real export and QC
        run: python tests/test_run118_export_qc.py
      - name: Run119 Windows launcher contract
        run: python tests/test_run119_windows_launcher.py

  windows-launcher-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate launcher contract on Windows
        shell: pwsh
        run: python tests/test_run119_windows_launcher.py
      - name: Verify configured full runtime on Windows
        shell: pwsh
        run: |
          $rel = (Get-Content runtime\active_runtime.txt -Raw).Trim()
          $target = Join-Path $PWD $rel
          if (!(Test-Path $target)) { throw "Configured runtime missing: $target" }
          if ((Get-Item $target).Length -le 100000) { throw "Configured runtime is not full-size" }
          Write-Host "ACTIVE_RUNTIME=$rel"
      - name: Execute real cmd to pythonw process handoff
        shell: cmd
        env:
          ZEROCUT_APP_OVERRIDE: tests\run119_launcher_probe.pyw
          ZEROCUT_LAUNCHER_WAIT: "1"
          ZEROCUT_LAUNCHER_NO_PAUSE: "1"
          ZEROCUT_PROBE_FILE: ${{ github.workspace }}\run119-launcher-probe.ok
        run: |
          call ZeroCut.cmd
          if errorlevel 1 exit /b %errorlevel%
          if not exist "%ZEROCUT_PROBE_FILE%" exit /b 20
          type "%ZEROCUT_PROBE_FILE%"
      - name: Verify process probe output
        shell: pwsh
        run: |
          $probe = Get-Content run119-launcher-probe.ok -Raw
          if ($probe -notmatch "ZEROCUT_RUN119_PROCESS_HANDOFF=PASS") { throw "Launcher process handoff marker missing" }
          Write-Host $probe
      - name: Execute active runtime status through launcher
        shell: cmd
        env:
          ZEROCUT_LAUNCHER_WAIT: "1"
          ZEROCUT_LAUNCHER_NO_PAUSE: "1"
        run: |
          call ZeroCut.cmd --ai-status
          if errorlevel 1 exit /b %errorlevel%
      - name: Install FFmpeg fixture for UI readiness
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $ff = (Get-Command ffmpeg.exe).Source
          $dir = Split-Path $ff
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          ffmpeg -version
          ffprobe -version
      - name: Launch actual ZeroCut local UI
        shell: cmd
        env:
          ZEROCUT_LAUNCHER_NO_PAUSE: "1"
        run: |
          call ZeroCut.cmd --no-browser --port 18765
          if errorlevel 1 exit /b %errorlevel%
      - name: Verify actual local UI endpoint
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddSeconds(45)
          $ok = $false
          do {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:18765/" -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200 -and $r.Content -match "ZeroCut") {
                $ok = $true
                break
              }
            } catch {}
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)
          if (!$ok) {
            if (Test-Path diagnostics\startup-crash.log) { Get-Content diagnostics\startup-crash.log }
            if (Test-Path diagnostics\ffmpeg-bootstrap-error.log) { Get-Content diagnostics\ffmpeg-bootstrap-error.log }
            throw "ZeroCut local UI endpoint did not become ready"
          }
          Write-Host "ZEROCUT_RUN119_UI_ENDPOINT=PASS"
      - name: Stop ZeroCut UI smoke
        if: always()
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process |
            Where-Object { $_.CommandLine -match "ZeroCut_Run112_Candidate_WhisperUX.pyw" -and $_.CommandLine -match "18765" } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
