name: ZeroCut Source Truth Smoke

on:
  workflow_dispatch:
  push:
    branches: [main, "candidate/**"]
    paths:
      - "src/**"
      - "runtime/**"
      - "packaging/**"
      - "rollback/**"
      - "reports/**"
      - "tests/**"
      - "ZeroCut.cmd"
      - "STATUS.md"
      - "CURRENT_MISSION.md"
      - ".github/workflows/zerocut-smoke.yml"

jobs:
  source-truth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install FFmpeg test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          ffmpeg -version
          ffprobe -version
      - name: Verify recovered baseline
        run: python tests/test_source_truth.py
      - name: Run101 media reliability integration
        if: hashFiles('src/ZeroCut_Run101_Candidate_MediaReliability.pyw') != ''
        run: python tests/test_run101_media_reliability.py
      - name: Run102 project recovery integration
        if: hashFiles('src/ZeroCut_Run102_Candidate_ProjectRecovery.pyw') != ''
        run: python tests/test_run102_project_recovery.py
      - name: Run103 concurrency safety
        if: hashFiles('src/ZeroCut_Run103_Candidate_ConcurrencySafety.pyw') != ''
        run: python tests/test_run103_concurrency_safety.py
      - name: Run106 timeline reliability
        if: hashFiles('src/ZeroCut_Run106_Candidate_TimelineReliability.pyw') != ''
        run: python tests/test_run106_timeline_reliability.py
      - name: Run107 A/V integrity
        if: hashFiles('src/ZeroCut_Run107_Candidate_AVIntegrity.pyw') != ''
        run: python tests/test_run107_av_integrity.py
      - name: Run108 highlight core
        if: hashFiles('src/ZeroCut_Run108_Candidate_HighlightCore.pyw') != ''
        run: python tests/test_run108_highlight_core.py
      - name: Run109 R6 evidence gate
        if: hashFiles('src/ZeroCut_Run109_Candidate_R6EvidenceGate.pyw') != ''
        run: python tests/test_run109_r6_evidence_gate.py
      - name: Run111 real Whisper certification
        if: hashFiles('src/ZeroCut_Run111_Candidate_WhisperCertification.pyw') != ''
        run: python tests/test_run111_whisper_certification.py
      - name: Run112 Whisper product UX
        if: hashFiles('src/ZeroCut_Run112_Candidate_WhisperUX.pyw') != ''
        run: python tests/test_run112_whisper_ux.py
      - name: Run116 transcript and auto-edit regression
        run: python tests/test_run116_transcript_regression.py
      - name: Run117 transcript edit UI
        run: python tests/test_run117_transcript_ui.py
      - name: Run118 edited timeline real export and QC
        run: python tests/test_run118_export_qc.py
      - name: Run119 Windows launcher contract
        run: python tests/test_run119_windows_launcher.py
      - name: Run120 one-file packaging contract
        run: python tests/test_run120_onefile_contract.py

  windows-launcher-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate launcher contract on Windows
        shell: pwsh
        run: python tests/test_run119_windows_launcher.py
      - name: Verify configured runtime chain on Windows
        shell: pwsh
        run: |
          $rel = (Get-Content runtime\active_runtime.txt -Raw).Trim()
          $target = Join-Path $PWD $rel
          if (!(Test-Path $target)) { throw "Configured runtime missing: $target" }
          $required = Get-Content runtime\active_runtime.required.txt | Where-Object { $_.Trim() }
          if ($required.Count -lt 6) { throw "Runtime dependency manifest incomplete" }
          foreach ($item in $required) {
            $path = Join-Path $PWD $item.Trim()
            if (!(Test-Path $path)) { throw "Runtime dependency missing: $item" }
            if ((Get-Item $path).Length -le 500) { throw "Runtime dependency unexpectedly small: $item" }
          }
          Write-Host "ACTIVE_RUNTIME=$rel"
          Write-Host "ACTIVE_RUNTIME_CHAIN=$($required.Count)"
      - name: Execute real cmd to pythonw process handoff
        shell: cmd
        env:
          ZEROCUT_APP_OVERRIDE: tests\run119_launcher_probe.pyw
          ZEROCUT_LAUNCHER_WAIT: "1"
          ZEROCUT_LAUNCHER_NO_PAUSE: "1"
          ZEROCUT_PROBE_FILE: ${{ github.workspace }}\run119-launcher-probe.ok
        run: |
          call ZeroCut.cmd
          if errorlevel 1 exit /b %errorlevel%
          if not exist "%ZEROCUT_PROBE_FILE%" exit /b 20
          type "%ZEROCUT_PROBE_FILE%"
      - name: Verify process probe output
        shell: pwsh
        run: |
          $probe = Get-Content run119-launcher-probe.ok -Raw
          if ($probe -notmatch "ZEROCUT_RUN119_PROCESS_HANDOFF=PASS") { throw "Launcher process handoff marker missing" }
          Write-Host $probe
      - name: Execute active runtime status through launcher
        shell: cmd
        env:
          ZEROCUT_LAUNCHER_WAIT: "1"
          ZEROCUT_LAUNCHER_NO_PAUSE: "1"
        run: |
          call ZeroCut.cmd --ai-status
          if errorlevel 1 exit /b %errorlevel%
      - name: Install FFmpeg fixture for UI readiness
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $ff = (Get-Command ffmpeg.exe).Source
          $dir = Split-Path $ff
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          ffmpeg -version
          ffprobe -version
      - name: Launch and certify actual ZeroCut local UI in one step
        shell: cmd
        env:
          ZEROCUT_LAUNCHER_NO_PAUSE: "1"
          ZEROCUT_LAUNCHER_VERIFY_READY: "1"
          ZEROCUT_HOME: ${{ github.workspace }}\run119-home
          ZEROCUT_READY_FILE: ${{ github.workspace }}\run119-ready.json
        run: |
          call ZeroCut.cmd --no-browser --port 18765 --ready-file "%ZEROCUT_READY_FILE%"
          if errorlevel 1 (
            type zerocut-launcher.log
            exit /b %errorlevel%
          )
          if not exist "%ZEROCUT_READY_FILE%" exit /b 21
          type zerocut-launcher.log
          type "%ZEROCUT_READY_FILE%"
      - name: Stop ZeroCut UI smoke
        if: always()
        shell: pwsh
        env:
          ZEROCUT_READY_FILE: ${{ github.workspace }}\run119-ready.json
        run: |
          if (Test-Path $env:ZEROCUT_READY_FILE) {
            try {
              $ready = Get-Content $env:ZEROCUT_READY_FILE -Raw | ConvertFrom-Json
              Stop-Process -Id ([int]$ready.pid) -Force -ErrorAction SilentlyContinue
            } catch {}
          }

  windows-onefile-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify one-file packaging contract
        shell: pwsh
        run: python tests/test_run120_onefile_contract.py
      - name: Build and smoke ZeroCut.exe
        shell: pwsh
        run: .\packaging\windows\build_onefile.ps1
      - name: Install FFmpeg for packaged UI smoke
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $ff = (Get-Command ffmpeg.exe).Source
          (Split-Path $ff) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Smoke actual packaged ZeroCut.exe UI
        shell: pwsh
        run: |
          $env:ZEROCUT_HOME = Join-Path $PWD "run120-onefile-home"
          $ready = Join-Path $PWD "run120-onefile-ready.json"
          Remove-Item $ready -Force -ErrorAction SilentlyContinue
          $exe = Join-Path $PWD "dist\windows\ZeroCut.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList @("--no-browser","--port","18865","--ready-file",$ready) -PassThru
          try {
            python runtime\verify_ready.py $ready 60
            if ($LASTEXITCODE -ne 0) { throw "Packaged UI readiness failed" }
            $data = Get-Content $ready -Raw | ConvertFrom-Json
            if (!$data.ok -or !$data.pid) { throw "Packaged readiness payload invalid" }
            Write-Host "ZEROCUT_ONEFILE_UI=PASS"
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Publish ZeroCut one-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroCut-Windows-OneFile-${{ github.sha }}
          path: dist/windows/ZeroCut.exe
          if-no-files-found: error
          retention-days: 7
