name: ZeroCut Source Truth Smoke

on:
  workflow_dispatch:
  push:
    branches: [main, "candidate/**"]
    paths:
      - "src/**"
      - "rollback/**"
      - "reports/**"
      - "tests/**"
      - "ZeroCut.cmd"
      - "STATUS.md"
      - "CURRENT_MISSION.md"
      - ".github/workflows/zerocut-smoke.yml"

jobs:
  source-truth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install FFmpeg test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          ffmpeg -version
          ffprobe -version
      - name: Verify recovered baseline
        run: python tests/test_source_truth.py
      - name: Run101 media reliability integration
        if: hashFiles('src/ZeroCut_Run101_Candidate_MediaReliability.pyw') != ''
        run: python tests/test_run101_media_reliability.py
      - name: Run102 project recovery integration
        if: hashFiles('src/ZeroCut_Run102_Candidate_ProjectRecovery.pyw') != ''
        run: python tests/test_run102_project_recovery.py
      - name: Run103 concurrency safety
        if: hashFiles('src/ZeroCut_Run103_Candidate_ConcurrencySafety.pyw') != ''
        run: python tests/test_run103_concurrency_safety.py
      - name: Run106 timeline reliability
        if: hashFiles('src/ZeroCut_Run106_Candidate_TimelineReliability.pyw') != ''
        run: python tests/test_run106_timeline_reliability.py
      - name: Run107 A/V integrity
        if: hashFiles('src/ZeroCut_Run107_Candidate_AVIntegrity.pyw') != ''
        run: python tests/test_run107_av_integrity.py
      - name: Run108 highlight core
        if: hashFiles('src/ZeroCut_Run108_Candidate_HighlightCore.pyw') != ''
        run: python tests/test_run108_highlight_core.py
      - name: Run109 R6 evidence gate
        if: hashFiles('src/ZeroCut_Run109_Candidate_R6EvidenceGate.pyw') != ''
        run: python tests/test_run109_r6_evidence_gate.py
      - name: Run111 real Whisper certification
        if: hashFiles('src/ZeroCut_Run111_Candidate_WhisperCertification.pyw') != ''
        run: python tests/test_run111_whisper_certification.py
      - name: Run112 Whisper product UX
        if: hashFiles('src/ZeroCut_Run112_Candidate_WhisperUX.pyw') != ''
        run: python tests/test_run112_whisper_ux.py
      - name: Run116 transcript and auto-edit regression
        run: python tests/test_run116_transcript_regression.py
      - name: Run117 transcript edit UI
        run: python tests/test_run117_transcript_ui.py
      - name: Run118 edited timeline real export and QC
        run: python tests/test_run118_export_qc.py
      - name: Run119 Windows launcher contract
        run: python tests/test_run119_windows_launcher.py

  windows-launcher-smoke:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate launcher contract on Windows
        shell: pwsh
        run: python tests/test_run119_windows_launcher.py
      - name: Verify cmd parser can resolve runtime
        shell: cmd
        run: |
          dir /b src\ZeroCut_Run*_Candidate_*.pyw
          where pythonw.exe
